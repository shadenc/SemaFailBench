[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sem-fail-bench"
version = "0.3.0"
description = "SemaFailBench: detecting silent semantic degradation in LLM serving"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Rataj Albalawi" },
  { name = "Shaden Alangari" },
  { name = "Rimas Almarri" },
]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "langdetect>=1.0.9",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "regex>=2024.4.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "openpyxl>=3.1",
]
serve = [
  "openai>=1.40",
]

[project.scripts]
sfb = "sem_fail_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
